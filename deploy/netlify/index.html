<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Shaha Finlease · Loan Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 400 15px/1.55 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; background: radial-gradient(1200px 600px at -10% -10%, #1d63d8 0%, transparent 60%), linear-gradient(160deg, #0b3d91, #082a66);
      -webkit-font-smoothing: antialiased;
    }
    .box { max-width: 440px; text-align: center; }
    .mark { display: block; margin: 0 auto 22px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.1); }
    .tagline { font-size: 11.5px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; opacity: .72; margin-top: 8px; }
    .tagline i { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: currentColor; margin: 0 8px; vertical-align: middle; }
    h1 b { font-weight: 800; }
    h1 { font-size: 28px; letter-spacing: -.025em; margin: 0 0 6px; font-weight: 600; }
    p { margin: 0; opacity: .82; }
    .status { margin-top: 28px; display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px;
              background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); padding: 10px 16px; border-radius: 999px; }
    .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    a { color: #fff; font-weight: 600; }
    small { display: block; margin-top: 40px; opacity: .55; font-size: 12px; }
  </style>
</head>
<body>
  <main class="box">
    <svg class="mark" width="60" height="60" viewBox="0 0 40 40" role="img" aria-label="Shaha Finlease logo">
      <rect width="40" height="40" rx="10" fill="#fff"/>
      <rect x="9" y="22" width="5.5" height="9" rx="1.6" fill="#0b3d91" opacity=".55"/>
      <rect x="17.25" y="17" width="5.5" height="14" rx="1.6" fill="#0b3d91" opacity=".8"/>
      <rect x="25.5" y="11" width="5.5" height="20" rx="1.6" fill="#1d6fe8"/>
      <path d="M9.5 16.5 L17.5 11.5 L22 14 L30.5 8.5" fill="none" stroke="#0b3d91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Shaha <b>Finlease</b></h1>
    <p>Loan Management System</p>
    <div class="tagline">RBI-registered NBFC<i></i>Jogeshwari East, Mumbai</div>
    <div class="status" role="status"><span class="spin"></span><span id="msg">Connecting to the server…</span></div>
    <small>© <span id="y"></span> Shaha Finlease · Authorised personnel only</small>
  </main>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const msg = document.getElementById('msg');
    const started = Date.now();
    async function poll() {
      try {
        const r = await fetch('/healthz', { cache: 'no-store' });
        if (r.ok) { location.replace('/home'); return; }
      } catch (e) { /* server still waking */ }
      const s = Math.round((Date.now() - started) / 1000);
      if (s > 4) msg.textContent = `Starting the server… (${s}s — usually under a minute)`;
      if (s > 120) { msg.innerHTML = 'Still starting. <a href="/home">Try opening the app</a>'; return; }
      setTimeout(poll, 2500);
    }
    poll();
  </script>
</body>
</html>
