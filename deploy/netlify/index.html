<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#33162b">
  <title>Shaha Finlease · Loan Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 400 15px/1.55 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; background: radial-gradient(1100px 600px at -10% -10%, #5a2a4c 0%, transparent 60%), radial-gradient(700px 500px at 110% 110%, rgba(227,115,21,.22) 0%, transparent 60%), linear-gradient(160deg, #33162b, #200d1b);
      -webkit-font-smoothing: antialiased;
    }
    .box { max-width: 440px; text-align: center; }
    .mark { display: block; margin: 0 auto 18px; height: 62px; width: auto; }
    .tagline { font-size: 11.5px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; opacity: .72; margin-top: 8px; }
    .tagline i { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: currentColor; margin: 0 8px; vertical-align: middle; }
    .product { font-size: 17px; font-weight: 600; letter-spacing: -.01em; opacity: .95; }
    h1 { font-size: 28px; letter-spacing: -.025em; margin: 0 0 6px; font-weight: 600; }
    p { margin: 0; opacity: .82; }
    .status { margin-top: 28px; display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px;
              background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); padding: 10px 16px; border-radius: 999px; }
    .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #e37315; border-radius: 50%; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    a { color: #fff; font-weight: 600; }
    small { display: block; margin-top: 40px; opacity: .55; font-size: 12px; }
  </style>
</head>
<body>
  <main class="box">
    <img class="mark" src="/shaha-logo.png" alt="Shaha Finlease" width="190" height="53">
    <p class="product">Loan Management System</p>
    <div class="tagline">RBI-registered NBFC<i></i>Jogeshwari East, Mumbai</div>
    <div class="status" role="status"><span class="spin"></span><span id="msg">Connecting to the server…</span></div>
    <small>© <span id="y"></span> Shaha Finlease · Authorised personnel only</small>
  </main>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const msg = document.getElementById('msg');
    const started = Date.now();
    async function poll() {
      try {
        const r = await fetch('/healthz', { cache: 'no-store' });
        if (r.ok) { location.replace('/home'); return; }
      } catch (e) { /* server still waking */ }
      const s = Math.round((Date.now() - started) / 1000);
      if (s > 4) msg.textContent = `Starting the server… (${s}s — usually under a minute)`;
      if (s > 120) { msg.innerHTML = 'Still starting. <a href="/home">Try opening the app</a>'; return; }
      setTimeout(poll, 2500);
    }
    poll();
  </script>
</body>
</html>
