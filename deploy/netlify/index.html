<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Shaha Finlease · Loan Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b3d91'/><text x='16' y='22' font-size='16' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>SF</text></svg>">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 400 15px/1.55 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; background: radial-gradient(1200px 600px at -10% -10%, #1d63d8 0%, transparent 60%), linear-gradient(160deg, #0b3d91, #082a66);
      -webkit-font-smoothing: antialiased;
    }
    .box { max-width: 440px; text-align: center; }
    .mark { width: 56px; height: 56px; border-radius: 14px; background: #fff; color: #0b3d91; display: grid; place-items: center;
            font-weight: 800; font-size: 22px; margin: 0 auto 22px; }
    h1 { font-size: 26px; letter-spacing: -.022em; margin: 0 0 6px; font-weight: 700; }
    p { margin: 0; opacity: .82; }
    .status { margin-top: 28px; display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px;
              background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); padding: 10px 16px; border-radius: 999px; }
    .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    a { color: #fff; font-weight: 600; }
    small { display: block; margin-top: 40px; opacity: .55; font-size: 12px; }
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">SF</div>
    <h1>Shaha Finlease</h1>
    <p>Loan Management System</p>
    <div class="status" role="status"><span class="spin"></span><span id="msg">Connecting to the server…</span></div>
    <small>© <span id="y"></span> Shaha Finlease · Authorised personnel only</small>
  </main>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const msg = document.getElementById('msg');
    const started = Date.now();
    async function poll() {
      try {
        const r = await fetch('/healthz', { cache: 'no-store' });
        if (r.ok) { location.replace('/home'); return; }
      } catch (e) { /* server still waking */ }
      const s = Math.round((Date.now() - started) / 1000);
      if (s > 4) msg.textContent = `Starting the server… (${s}s — usually under a minute)`;
      if (s > 120) { msg.innerHTML = 'Still starting. <a href="/home">Try opening the app</a>'; return; }
      setTimeout(poll, 2500);
    }
    poll();
  </script>
</body>
</html>
